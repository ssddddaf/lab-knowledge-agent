[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-knowledge-agent"
version = "0.1.0"
description = "Evidence-grounded multimodal laboratory knowledge agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=0.6,<2", "langgraph-checkpoint-sqlite>=2,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9",
  "pymupdf>=1.24,<2", "qdrant-client>=1.12,<2", "neo4j>=5,<7",
  "rank-bm25>=0.2.2,<1", "openai>=1.60,<3", "pydantic>=2,<3",
  "pydantic-settings>=2,<3", "requests>=2.32,<3", "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
vision = ["torch>=2.4", "transformers>=4.49,<5", "accelerate>=1,<2", "colpali-engine>=0.3,<1", "pillow>=10,<12"]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
eval = ["pytest>=8,<10", "httpx>=0.27,<1", "reportlab>=4,<5"]

[project.scripts]
lab-agent = "lab_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
